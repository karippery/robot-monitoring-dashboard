[project]
name = "factorywatch"
version = "0.1.0"
description = "FactoryWatch is a dashboard application"
authors = [
    {name = "John",email = "your.email@example.com"}
]
requires-python = "^3.11"
dependencies = [
    "django (==5.2.8)",
    "djangorestframework (==3.16.1)",
    "channels (==4.3.1)",
    "channels-redis (==4.3.0)",
    "celery (==5.5.3)",
    "redis (==7.0.1)",
    "psycopg2-binary (==2.9.11)",
    "django-cors-headers (==4.9.0)",
    "django-filter (==25.2)",
    "django-environ (==0.12.0)",
    "djangorestframework-simplejwt (==5.5.1)",
    "drf-spectacular (>=0.29.0,<0.30.0)",
    "drf-yasg (==1.21.11)",
    "gunicorn (==23.0.0)",
    "sentry-sdk (==2.44.0)",
    "whitenoise (==6.11.0)",
    "django-debug-toolbar (>=6.1.0,<7.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.1,<10.0.0)",
    "pytest-django (>=4.11.1,<5.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "black (>=25.11.0,<26.0.0)",
    "isort (>=7.0.0,<8.0.0)",
    "pre-commit (>=4.4.0,<5.0.0)",
    "factory-boy (>=3.3.3,<4.0.0)",
    "django-debug-toolbar (>=6.1.0,<7.0.0)",
    "django-extensions (>=4.1,<5.0)",
    "uvicorn[standard] (>=0.30.0,<0.31.0)"
]

[tool.black]
line-length = 88
target-version = ['py311']

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88

[tool.flake8]
max-line-length = 88
extend-ignore = "E203,W503"
exclude = [".venv", "migrations", "staticfiles", "media"]